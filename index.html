<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Negotiation Prep — Salesforce × Marriott (fictional)</title>
<style>
  :root {
    --accent: #0176D3;
    --accent-dark: #014486;
    --accent-bg: #EAF4FE;
    --bg-page: #F3F4F6;
    --bg-card: #FFFFFF;
    --text-primary: #1B1B1E;
    --text-secondary: #55565A;
    --text-muted: #8A8B8F;
    --border: #E2E3E6;
    --border-strong: #C9CBD1;
    --green-bg: #E7F6EC; --green-text: #1B7A3D; --green-border: #B8E5C6;
    --amber-bg: #FFF6E5; --amber-text: #8A5A00; --amber-border: #F5D98A;
    --red-bg: #FDECEC; --red-text: #A3231F; --red-border: #F3B9B7;
    --gray-bg: #F0F1F3; --gray-text: #55565A; --gray-border: #DCDDE1;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,20,30,0.04), 0 1px 8px rgba(20,20,30,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.55;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 6px; flex-wrap: wrap; }
  header.top h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  header.top p.sub { margin: 0; color: var(--text-secondary); font-size: 14px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--gray-bg); color: var(--gray-text); border: 1px solid var(--gray-border); white-space: nowrap; }
  .disclaimer {
    background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text);
    border-radius: var(--radius); padding: 12px 16px; font-size: 13px; margin: 16px 0 24px;
  }
  .disclaimer strong { display: block; margin-bottom: 2px; font-size: 13px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .controls-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .controls-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .field input, .field select, .field textarea {
    font: inherit; font-size: 14px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: #fff; color: var(--text-primary); width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .field textarea { resize: vertical; min-height: 44px; }
  .field-full { grid-column: 1 / -1; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer; transition: transform 0.05s ease;
  }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); }
  button.secondary { background: #fff; color: var(--text-primary); border-color: var(--border-strong); }
  button.secondary:hover { background: var(--gray-bg); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #output { margin-top: 24px; }
  #output:empty { display: none; }
  .meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; font-size: 13px; color: var(--text-secondary); }
  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; color: var(--text-primary); }
  .section-title .count { font-weight: 500; color: var(--text-muted); font-size: 12px; margin-left: 6px; }
  .item-row { padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .item-row:first-child { border-top: none; padding-top: 0; }
  .item-row .src { color: var(--text-muted); font-size: 12px; display: block; margin-top: 3px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; text-transform: uppercase; letter-spacing: 0.02em; }
  .badge-high, .badge-confirmed { background: var(--green-bg); color: var(--green-text); border: 1px solid var(--green-border); }
  .badge-medium, .badge-resolved { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
  .badge-low { background: var(--gray-bg); color: var(--gray-text); border: 1px solid var(--gray-border); }
  .badge-inferred { background: var(--accent-bg); color: var(--accent-dark); border: 1px solid #BFE0FB; }
  .evidence { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
  .subhead { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 14px 0 6px; }
  .subhead:first-child { margin-top: 0; }
  .conflict-box { background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .conflict-box .topic { font-weight: 700; color: var(--red-text); font-size: 13px; margin-bottom: 6px; }
  .conflict-box ul { margin: 0 0 6px; padding-left: 18px; font-size: 13px; }
  .conflict-box .status { font-size: 12px; color: var(--text-secondary); }
  .conflict-pointer { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  pre.json-block { background: #F7F8FA; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; overflow-x: auto; margin: 4px 0 10px; }
  .empty-note { color: var(--text-muted); font-size: 13px; font-style: italic; }
  .source-list { font-size: 13px; color: var(--text-secondary); }
  .source-list li { margin-bottom: 6px; }
  .source-list code { background: var(--gray-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  footer.note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 28px; }
  .stakeholder-card { border-left: 3px solid var(--accent); padding-left: 12px; margin-bottom: 10px; }
  .stakeholder-card:last-child { margin-bottom: 0; }
  .stakeholder-name { font-weight: 700; font-size: 14px; }
  .stakeholder-role { color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Negotiation prep briefing generator</h1>
      <p class="sub">Salesforce × Marriott renewal — fictional classroom exercise</p>
    </div>
    <span class="pill">Stage 2 · interaction-heavy tool</span>
  </header>

  <div class="disclaimer" id="disclaimer-banner"></div>

  <div class="card">
    <div class="controls-grid">
      <div class="field field-full">
        <label for="meetingWith">Who are you meeting with today?</label>
        <input id="meetingWith" list="stakeholderList" placeholder="e.g. Rachel Kim" autocomplete="off">
        <datalist id="stakeholderList"></datalist>
      </div>
      <div class="field">
        <label for="focus">Focus area</label>
        <select id="focus">
          <option value="pricing">Pricing</option>
          <option value="seats">Seats / licensing</option>
          <option value="ai_einstein">AI / Einstein</option>
          <option value="sandboxes">Sandboxes</option>
          <option value="deadline">Deadline / timeline</option>
          <option value="competitive">Competitive situation</option>
          <option value="general" selected>General (full briefing)</option>
        </select>
      </div>
      <div class="field">
        <label for="notes">Session notes (optional)</label>
        <input id="notes" placeholder="e.g. follow-up after May emails">
      </div>
    </div>
    <div class="btn-row">
      <button class="primary" id="generateBtn">Generate briefing</button>
      <button class="secondary" id="downloadBtn" disabled>Download as Markdown</button>
      <button class="secondary" id="copyBtn" disabled>Copy to clipboard</button>
    </div>
  </div>

  <div id="output"></div>

  <footer class="note">Fictional classroom exercise. Not real Salesforce or Marriott information. This tool does not recommend which offer to make or accept.</footer>
</div>

<script id="packet-data" type="application/json">
{
  "classroom_use_disclaimer": {
    "statement": "This dataset is a fictional classroom exercise. Salesforce and Marriott International are real companies referenced only as a realistic setting for a negotiation-preparation training assignment. All prices, contract terms, metrics, stakeholders, communications, alternatives, and negotiation positions in the six source files (crm_account_overview.csv, current_contract_terms.csv, discovery_call_notes.md, usage_outcomes_report.md, email_thread_excerpt.md, salesforce_marriott_internal_pricing_limits.csv) are invented for this assignment. Nothing in this file should be treated as real confidential, financial, or business information belonging to either company.",
    "source": "assignment instructions (not derived from any of the six source files)",
    "note": "salesforce_marriott_internal_pricing_limits.csv was added after the initial five-file consolidation, at the account executive's explicit request, to fill gaps in the sign-off checklist (opening/target/acceptable/minimum pricing, seat floor, concession limits, estimated customer budget). It is authored fictional content, not extracted from an uploaded document, and is flagged as such wherever it is used below."
  },

  "account_overview": {
    "account_name": { "value": "Marriott International", "source": "crm_account_overview.csv" },
    "industry": { "value": "Hospitality", "source": "crm_account_overview.csv" },
    "salesforce_account_owner": {
      "value": "Jorge Alvarez",
      "title": "Salesforce Account Executive (AE)",
      "note": "CRM lists 'J. Alvarez'; first name 'Jorge' confirmed via his email signature.",
      "source": ["crm_account_overview.csv", "email_thread_excerpt.md"]
    },
    "account_id": { "value": "SFDC-MI-00291", "source": "crm_account_overview.csv" },
    "account_tier": { "value": "Strategic", "source": "crm_account_overview.csv" },
    "product_line": { "value": "Sales Cloud + Service Cloud Enterprise Edition", "source": "crm_account_overview.csv" },
    "last_qbr_date": { "value": "2026-04-15", "source": "crm_account_overview.csv", "note": "Normalized from 04/15/2026." },
    "official_renewal_target_date": {
      "value": "2027-01-31",
      "source": "crm_account_overview.csv",
      "note": "Matches current contract end date. See conflicts log (C-3): email_thread_excerpt.md states an internal deadline of 2026-12-15."

  },

  "stakeholders": {
    "confirmed": [
      {
        "name": "Rachel Kim",
        "organization": "Marriott",
        "title": {
          "status": "conflicting",
          "values": [
            { "value": "VP of Procurement", "source": "crm_account_overview.csv (field: primary_contact_title)" },

        "role_in_negotiation": "Primary contact; leads pricing/terms conversation; will escalate final approval to Marriott's CFO's office.",
        "source": ["crm_account_overview.csv", "discovery_call_notes.md", "email_thread_excerpt.md"]
      },
      {
        "name": "Devon Osei",
        "organization": "Marriott",
        "title": "Director of Sales Operations",
        "role_in_negotiation": "Secondary contact; represents Sales Ops and contact center perspective; raised Service Cloud wins and AI/Einstein bundling question.",
        "source": ["crm_account_overview.csv", "discovery_call_notes.md"]
      },
      {
        "name": "Jorge Alvarez",
        "organization": "Salesforce",
        "title": "Account Executive",
        "role_in_negotiation": "Account owner; primary Salesforce negotiator; routes seat/AI pricing questions to deal desk.",
        "source": ["crm_account_overview.csv", "discovery_call_notes.md", "email_thread_excerpt.md"]
      },
      {
        "name": null,
        "organization": "Marriott",
        "title": "CFO's office (unnamed individual)",
        "role_in_negotiation": "Final sign-off authority for the renewal; no specific person named in any source.",
        "source": "discovery_call_notes.md"
      }
    ],
    "inferred": [
      {
        "statement": "Rachel Kim is an influencer/champion who can shape terms but is not the final decision-maker.",
        "confidence": "high",
        "evidence": "She stated final sign-off is 'above my pay grade, it'll go to our CFO's office' (discovery_call_notes.md).",
        "source": "discovery_call_notes.md"
      }
    ]
  },

  "current_contract": {
    "contract_id": { "value": "MSA-2024-0187", "source": "current_contract_terms.csv" },
    "effective_date": { "value": "2024-02-01", "source": "current_contract_terms.csv", "note": "Matches crm_account_overview.csv current_contract_start_date (02/01/2024)." },
    "term_length_months": { "value": 36, "source": "current_contract_terms.csv" },
    "end_date": { "value": "2027-01-31", "source": "crm_account_overview.csv", "note": "Consistent with a 36-month term starting 2024-02-01. See conflicts log (C-3)." },
    "annual_list_price_usd": { "value": 1920000, "source": "current_contract_terms.csv" },
    "annual_negotiated_price_usd": { "value": 1780000, "source": "current_contract_terms.csv", "note": "Internally consistent with list price minus discount (1,920,000 x (1-0.073) ≈ 1,779,840). See conflicts log (C-2) re: CRM's differing 'current_annual_contract_value_usd'." },

    "current_annual_contract_value_usd_per_crm": { "value": 1850000, "source": "crm_account_overview.csv", "note": "Conflicts with current_contract_terms.csv annual_negotiated_price_usd. See conflicts log (C-2)." },
    "licensed_seats": { "value": 4200, "source": "current_contract_terms.csv", "note": "Matches crm_account_overview.csv current_licensed_users (4200)." },
    "support_tier": { "value": "Premier Success Plan", "source": "current_contract_terms.csv" },
    "payment_terms": { "value": "Net 45", "source": "current_contract_terms.csv" },
    "auto_renewal_clause": { "value": "Yes - 60-day opt-out notice required", "source": "current_contract_terms.csv" },
    "included_sandboxes": { "value": 3, "unit": "full sandboxes", "source": "current_contract_terms.csv" },
    "data_storage_allotment_gb": { "value": 500, "source": "current_contract_terms.csv" }
  },

  "requested_terms": {
    "confirmed": [
      {
        "request": "Move from a flat 4,200-seat commitment to a usage-based/true-up (and true-down) seat model.",
        "detail": "Marriott's internal number for seats it would 'confidently commit to today' is closer to 3,600.",
        "confidently_committable_seats": 3600,
        "source": ["email_thread_excerpt.md", "discovery_call_notes.md (raised as an open idea before being formalized in the email)"]
      },
      {
        "request": "Include AI/Einstein features in the base price, at minimum for the contact center team, rather than as a billed add-on.",
        "source": ["email_thread_excerpt.md", "discovery_call_notes.md (raised as an open question)"]
      },
      {
        "request": "Move to a 3-year term if the effective annual price drops meaningfully.",
        "target_annual_price_usd_low": 1500000,
        "target_annual_price_usd_high": 1600000,
        "source": "email_thread_excerpt.md"
      },
      {
        "request": "Two additional full sandboxes at no incremental cost.",
        "source": ["email_thread_excerpt.md", "discovery_call_notes.md (generic mention of wanting more sandboxes, no number given)"]
      },
      {
        "request": "Finalize the renewal by December 15, 2026 due to a corporate budget cycle change communicated by Marriott Legal.",
        "source": "email_thread_excerpt.md",
        "note": "Conflicts with the contract's original end date / CRM renewal target of 2027-01-31. See conflicts log (C-3)."
      }
    ],
    "inferred": []
  },

  "usage_and_outcomes": {
    "confirmed": {
      "reporting_period": { "value": "2026-01-01 to 2026-03-31", "label": "Q1 2026", "source": "usage_outcomes_report.md" },
      "active_weekly_users_sales_cloud": { "value": 3180, "source": "usage_outcomes_report.md" },
      "active_weekly_users_service_cloud": { "value": 2540, "source": "usage_outcomes_report.md" },
      "total_licensed_seats": { "value": 4200, "source": "usage_outcomes_report.md" },
      "overall_license_utilization_pct": { "value": 76, "source": "usage_outcomes_report.md", "note": "Methodology not specified; does not map cleanly onto the per-product weekly active user counts. See unresolved_questions." },

        "emea": { "value": 58, "source": "usage_outcomes_report.md" },
        "apac": { "value": 49, "source": "usage_outcomes_report.md" }
      },
      "avg_case_resolution_time_change_pct_yoy": { "value": -22, "scope": "Service Cloud, contact center", "source": "usage_outcomes_report.md" },
      "sales_cycle_length_change_pct_yoy": { "value": -9, "scope": "Sales Cloud, group bookings team", "source": "usage_outcomes_report.md" },
      "platform_support_tickets_q1_2026": { "value": 340, "source": "usage_outcomes_report.md" },
      "support_tickets_resolved_within_sla_pct": { "value": 91, "source": "usage_outcomes_report.md" }
    },
    "notes": [
      {
        "statement": "APAC utilization has been consistently low for three straight quarters and is flagged internally as an at-risk pocket of the account.",
        "source": "usage_outcomes_report.md"
      },
      {
        "statement": "Root cause of the APAC utilization gap is not confirmed. Theories (incomplete regional rollout, language/localization gap) are explicitly labeled unvalidated with the customer in the source document itself.",
        "source": "usage_outcomes_report.md"
      },
      {
        "statement": "The North America contact center team has become an internal reference/advocate and has informally agreed to participate in a case study if asked.",
        "source": "usage_outcomes_report.md"

  "salesforce_objectives": {
    "confirmed": [
      {
        "statement": "The Salesforce AE stated he needs to run the seat-reduction and AI-bundling requests by the deal desk before confirming anything on pricing.",
        "source": "email_thread_excerpt.md"
      },
      {

    },

 * Pure functions, no DOM dependency. Ported 1:1 from

 * version stay in sync. Usable in Node (for testing) and in the browser
 * (index.html loads this file via <script src>).
 *
 * Design rule: this module never invents content. Every fact rendered
 * must already exist in the packet object passed in. meetingWith/focus/
 * notes are situational inputs, rendered as labeled context, never
 * merged into "confirmed" facts.
 */
(function (root, factory) {

})(typeof self !== "undefined" ? self : this, function () {

  var VALID_FOCUS = ["pricing", "seats", "ai_einstein", "sandboxes", "deadline", "competitive", "general"];

  var FOCUS_LABELS = {
    pricing: "Pricing",
    seats: "Seats / licensing",
    ai_einstein: "AI / Einstein",
    sandboxes: "Sandboxes",
    deadline: "Deadline / timeline",
    competitive: "Competitive situation",
    general: "General (full briefing)"
  };

  var FOCUS_KEYWORDS = {
    pricing: ["price", "pricing", "discount", "usd", "cost", "acv", "annual", "$"],
    seats: ["seat", "user", "true-up", "true up", "license", "licensed"],
    ai_einstein: ["ai", "einstein", "bundl"],
    sandboxes: ["sandbox"],
    deadline: ["deadline", "december", "january", "2027-01", "2026-12", "fiscal", "finaliz"],
    competitive: ["competitor", "competitive", "benchmark", "displacement", "vendor"]
  };

  var LIMITS_FOCUS_MAP = {
    pricing_positions_usd_annual_3yr_term: ["pricing"],
    term_length_adjustments: ["pricing", "deadline"],
    seat_floor: ["seats"],
    discount_limits: ["pricing"],

    sandbox_limits: ["sandboxes"],
    estimated_customer_budget_ceiling_usd_annual: ["pricing", "competitive"],
    walkaway_guidance: ["always"]
  };

  function matchesFocus(item, focus) {
    if (focus === "general") return true;
    var text = JSON.stringify(item).toLowerCase();
    var kws = FOCUS_KEYWORDS[focus] || [];
    for (var i = 0; i < kws.length; i++) {
      if (text.indexOf(kws[i]) !== -1) return true;
    }
    return false;
  }

  function fmtSource(src) {
    if (src === null || src === undefined) return "no source (flagged gap)";
    if (Array.isArray(src)) return src.join(", ");
    return String(src);
  }

  function humanizeKey(k) {
    return String(k).replace(/_/g, " ");
  }

  // ---- Section builders. Each returns a plain-data section object that
  // both the HTML renderer and the Markdown renderer can consume. ----

  function buildStakeholderSection(stakeholders, meetingWith) {
    var namesRequested = String(meetingWith || "")
      .split(",")
      .map(function (n) { return n.trim().toLowerCase(); })
      .filter(Boolean);
    var matched = [];
    (stakeholders.confirmed || []).forEach(function (s) {
      var name = (s.name || "").toLowerCase();
      if (!name) return;
      var isMatch = namesRequested.some(function (nr) {
        return name.indexOf(nr) !== -1 || nr.indexOf(name) !== -1;
      });
      if (isMatch) matched.push(s);
    });
    return { id: "stakeholders", title: "Stakeholders in the room", type: "stakeholders", matched: matched, queried: meetingWith };
  }

  function buildFactListSection(id, title, obj, focus) {
    var items = [];
    Object.keys(obj).forEach(function (key) {
      var v = obj[key];
      var entry = (v && typeof v === "object" && !Array.isArray(v)) ? Object.assign({ label: key }, v) : { label: key, value: v };
      if (matchesFocus(entry, focus)) items.push(entry);

    return { id: id, title: title, type: "fact-list", items: items };
  }

  function buildStatementListSection(id, title, list, focus, textKeys) {
    textKeys = textKeys || ["statement", "question", "request"];
    var items = (list || []).filter(function (i) { return matchesFocus(i, focus); });
    return { id: id, title: title, type: "statement-list", items: items, textKeys: textKeys };

    var confirmedRaw = section.confirmed;

      buildLimitsSection(packet.minimum_limits, focus),

      buildStatementListSection("concessions_confirmed", "Available concessions (confirmed, Deal-Desk-backed)", packet.concessions.confirmed_available_concessions, focus),
      buildStatementListSection("concessions_inferred", "Possible concessions (speculative)", packet.concessions.inferred_possible_concessions, focus),
      buildStatementListSection("likely_objections", "Likely objections", packet.likely_objections, focus),
      buildStatementListSection("unresolved_questions", "Unresolved questions", packet.unresolved_questions, focus),
      buildConflictsSection(packet.conflicts, focus)
    ];

    return {
      meta: meta,
      accountSnapshot: accountSnapshot,
      sections: sections,
      sourceReferences: packet.source_references
    };
  }

  // ---- Markdown renderer (mirrors the Python CLI's output format) ----

  function itemLine(i, textKeys) {
    var text = null;
    for (var k = 0; k < textKeys.length; k++) {
      if (i[textKeys[k]] !== undefined) { text = i[textKeys[k]]; break; }
    }
    if (text === null) text = JSON.stringify(i);
    var extra = [];
    if (i.confidence) extra.push("confidence: " + i.confidence);
    if (i.status) extra.push("status: " + i.status);
    var extraStr = extra.length ? " (" + extra.join("; ") + ")" : "";
    return "- " + text + extraStr + " _(source: " + fmtSource(i.source) + ")_";
  }

  function renderMarkdown(model) {
    var lines = [];
    var m = model.meta;
    lines.push("# Negotiation prep briefing — Salesforce–Marriott renewal (fictional)");
    lines.push("**Generated:** " + m.generatedAt + "  ");
    lines.push("**Meeting with:** " + m.meetingWith + "  ");
    lines.push("**Focus:** " + m.focusLabel);
    if (m.notes) lines.push("**Session notes (user-entered, not a packet fact):** " + m.notes);
    lines.push("\n> " + m.disclaimer);

    lines.push("\n## Account snapshot");
    model.accountSnapshot.lines.forEach(function (l) { lines.push("- " + l); });

    model.sections.forEach(function (sec) {
      lines.push("\n### " + sec.title);
      if (sec.type === "stakeholders") {
        if (sec.matched.length === 0) {
          lines.push('_No stakeholder in the packet matched "' + sec.queried + '" by name. Proceeding with a general briefing; verify who is actually attending before the meeting._');
        } else {
          sec.matched.forEach(function (s) {
            var titleStr;
            if (s.title && typeof s.title === "object") {
              titleStr = s.title.values.map(function (v) { return v.value; }).join(" / ") + " (title is CONFLICTING — see conflicts log)";
            } else {
              titleStr = s.title;
            }
            lines.push("- **" + s.name + "** (" + s.organization + ") — " + titleStr + ". " + (s.role_in_negotiation || ""));
          });
        }
      } else if (sec.type === "fact-list") {
        if (sec.items.length === 0) { lines.push("_No fields match the selected focus._"); }
        sec.items.forEach(function (i) {
          lines.push("- " + humanizeKey(i.label) + ": " + i.value + " _(source: " + fmtSource(i.source) + ")_" + (i.note ? " — " + i.note : ""));
        });
      } else if (sec.type === "statement-list") {
        if (sec.items.length === 0) { lines.push("_No items match the selected focus._"); }
        sec.items.forEach(function (i) { lines.push(itemLine(i, sec.textKeys)); });
      } else if (sec.type === "confirmed-inferred") {
        if (sec.confirmed.length) {
          lines.push("**Confirmed:**");
          sec.confirmed.forEach(function (i) {
            var stmt = i.statement || i.value || i.name || JSON.stringify(i);
            lines.push("- " + stmt + " _(source: " + fmtSource(i.source) + ")_");
          });
        }
        if (sec.inferred.length) {
          lines.push("**Inferred (not confirmed):**");
          sec.inferred.forEach(function (i) {
            lines.push("- " + i.statement + " — **confidence: " + i.confidence + "**. Evidence: " + i.evidence + " _(source: " + fmtSource(i.source) + ")_");
          });
        }
        if (!sec.confirmed.length && !sec.inferred.length) lines.push("_No items match the selected focus._");
      } else if (sec.type === "json-blocks") {
        if (sec.blocks.length === 0) { lines.push("_No limits sub-sections match the selected focus._"); }
        sec.blocks.forEach(function (b) {
          lines.push("**" + humanizeKey(b.key) + ":**");
          lines.push("```\n" + JSON.stringify(b.value, null, 2) + "\n```");
        });
      } else if (sec.type === "conflicts") {
        if (sec.relevant.length === 0) {
          lines.push("_No conflicts directly tied to this focus area._");
        } else {
          sec.relevant.forEach(function (c) {
            lines.push("- **" + c.id + " — " + c.topic + "**");
            c.conflicting_values.forEach(function (cv) {
              lines.push("    - " + cv.value + " _(source: " + cv.source + ")_");
            });
            lines.push("    - Status: " + c.resolution_status + ". " + (c.note || ""));
          });
        }
        lines.push("_(Full conflict log has " + sec.total + " entries: " + sec.allIds.join(", ") + ". Shown above for this focus: " + (sec.shownIds.join(", ") || "none") + ". Review the full packet's `conflicts` array before treating any figure above as settled.)_");
      }
    });

    lines.push("\n### Full source list");
    model.sourceReferences.forEach(function (s) {
      lines.push("- `" + s.file + "` — " + s.description);
    });

    lines.push("\n---\n_This briefing is generated entirely from the negotiation packet. It does not recommend which offer to make or accept — that decision is the account executive's. Fictional classroom exercise; not real Salesforce or Marriott information._");

    return lines.join("\n");
  }

  return {
    VALID_FOCUS: VALID_FOCUS,
    FOCUS_LABELS: FOCUS_LABELS,
    matchesFocus: matchesFocus,
    fmtSource: fmtSource,
    buildBriefingModel: buildBriefingModel,
    renderMarkdown: renderMarkdown
  };
});

</script>
<script>
(function () {
  var packet = JSON.parse(document.getElementById('packet-data').textContent);
  var disclaimerBanner = document.getElementById('disclaimer-banner');
  disclaimerBanner.innerHTML = '<strong>Classroom-use disclaimer</strong>' + escapeHtml(packet.classroom_use_disclaimer.statement);

  // The <select> and <datalist> already have static fallback options in the
  // HTML (in case this script fails to load or run on some host). Clear them
  // here before repopulating from the packet, so options aren't duplicated.
  var focusSelect = document.getElementById('focus');
  focusSelect.innerHTML = '';
  BriefingLogic.VALID_FOCUS.forEach(function (f) {
    var opt = document.createElement('option');
    opt.value = f;
    opt.textContent = BriefingLogic.FOCUS_LABELS[f];
    if (f === 'general') opt.selected = true;
    focusSelect.appendChild(opt);
  });

  var stakeholderList = document.getElementById('stakeholderList');
  stakeholderList.innerHTML = '';
  (packet.stakeholders.confirmed || []).forEach(function (s) {
    if (!s.name) return;
    var opt = document.createElement('option');
    opt.value = s.name;
    stakeholderList.appendChild(opt);
  });

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtSource(src) { return BriefingLogic.fmtSource(src); }

  function confidenceBadge(level) {
    if (!level) return '';
    return '<span class="badge badge-' + escapeHtml(level) + '">' + escapeHtml(level) + '</span>';
  }
  function statusBadge(status) {
    if (!status) return '';
    var cls = status === 'confirmed' ? 'badge-confirmed' : (status === 'resolved' ? 'badge-resolved' : 'badge-inferred');
    return '<span class="badge ' + cls + '">' + escapeHtml(status) + '</span>';
  }

  function renderItemRow(i, textKeys) {
    var text = null;
    for (var k = 0; k < textKeys.length; k++) { if (i[textKeys[k]] !== undefined) { text = i[textKeys[k]]; break; } }
    if (text === null) text = JSON.stringify(i);
    var badges = confidenceBadge(i.confidence) + statusBadge(i.status);
    var evidence = i.evidence ? '<div class="evidence">' + escapeHtml(i.evidence) + '</div>' : '';
    return '<div class="item-row">' + escapeHtml(text) + badges + evidence +
      '<span class="src">Source: ' + escapeHtml(fmtSource(i.source)) + '</span></div>';
  }

  function renderSection(sec) {
    var html = '<div class="card"><div class="section-title">' + escapeHtml(sec.title) + '</div>';

    if (sec.type === 'stakeholders') {
      if (sec.matched.length === 0) {
        html += '<p class="empty-note">No stakeholder in the packet matched &ldquo;' + escapeHtml(sec.queried) +
          '&rdquo; by name. Proceeding with a general briefing — verify who is actually attending before the meeting.</p>';
      } else {
        sec.matched.forEach(function (s) {
          var titleStr;
          if (s.title && typeof s.title === 'object') {
            titleStr = s.title.values.map(function (v) { return v.value; }).join(' / ') +
              ' <span class="badge badge-medium">title conflicting</span>';
          } else {
            titleStr = escapeHtml(s.title);
          }
          html += '<div class="stakeholder-card"><div class="stakeholder-name">' + escapeHtml(s.name) + ' &middot; ' + escapeHtml(s.organization) + '</div>' +
            '<div class="stakeholder-role">' + titleStr + '</div>' +
            '<div class="stakeholder-role">' + escapeHtml(s.role_in_negotiation || '') + '</div></div>';
        });
      }
    } else if (sec.type === 'fact-list') {
      if (sec.items.length === 0) { html += '<p class="empty-note">No fields match the selected focus.</p>'; }
      sec.items.forEach(function (i) {
        html += '<div class="item-row"><strong>' + escapeHtml(i.label.replace(/_/g, ' ')) + ':</strong> ' + escapeHtml(String(i.value)) +
          (i.note ? '<div class="evidence">' + escapeHtml(i.note) + '</div>' : '') +
          '<span class="src">Source: ' + escapeHtml(fmtSource(i.source)) + '</span></div>';
      });
    } else if (sec.type === 'statement-list') {
      if (sec.items.length === 0) { html += '<p class="empty-note">No items match the selected focus.</p>'; }
      sec.items.forEach(function (i) { html += renderItemRow(i, sec.textKeys); });
    } else if (sec.type === 'confirmed-inferred') {
      if (sec.confirmed.length === 0 && sec.inferred.length === 0) {
        html += '<p class="empty-note">No items match the selected focus.</p>';
      }
      if (sec.confirmed.length) {
        html += '<div class="subhead">Confirmed</div>';
        sec.confirmed.forEach(function (i) {
          var stmt = i.statement || i.value || i.name || JSON.stringify(i);
          html += '<div class="item-row">' + escapeHtml(stmt) + '<span class="src">Source: ' + escapeHtml(fmtSource(i.source)) + '</span></div>';
        });
      }
      if (sec.inferred.length) {
        html += '<div class="subhead">Inferred (not confirmed)</div>';
        sec.inferred.forEach(function (i) {
          html += '<div class="item-row">' + escapeHtml(i.statement) + confidenceBadge(i.confidence) +
            '<div class="evidence">' + escapeHtml(i.evidence) + '</div>' +
            '<span class="src">Source: ' + escapeHtml(fmtSource(i.source)) + '</span></div>';
        });
      }
    } else if (sec.type === 'json-blocks') {
      if (sec.blocks.length === 0) { html += '<p class="empty-note">No limits sub-sections match the selected focus.</p>'; }
      sec.blocks.forEach(function (b) {
        html += '<div class="subhead">' + escapeHtml(b.key.replace(/_/g, ' ')) + '</div>' +
          '<pre class="json-block">' + escapeHtml(JSON.stringify(b.value, null, 2)) + '</pre>';
      });
    } else if (sec.type === 'conflicts') {
      if (sec.relevant.length === 0) {
        html += '<p class="empty-note">No conflicts directly tied to this focus area.</p>';
      } else {
        sec.relevant.forEach(function (c) {
          html += '<div class="conflict-box"><div class="topic">' + escapeHtml(c.id) + ' — ' + escapeHtml(c.topic) + '</div><ul>';
          c.conflicting_values.forEach(function (cv) {
            html += '<li>' + escapeHtml(String(cv.value)) + ' <span class="src">(' + escapeHtml(cv.source) + ')</span></li>';
          });
          html += '</ul><div class="status">Status: ' + escapeHtml(c.resolution_status) + '. ' + escapeHtml(c.note || '') + '</div></div>';
        });
      }
      html += '<div class="conflict-pointer">Full conflict log has ' + sec.total + ' entries: ' + sec.allIds.join(', ') +
        '. Shown above for this focus: ' + (sec.shownIds.join(', ') || 'none') + '. Review the full packet before treating any figure as settled.</div>';
    }

    html += '</div>';
    return html;
  }

  function renderAccountSnapshot(snap) {
    var html = '<div class="card"><div class="section-title">' + escapeHtml(snap.title) + '</div>';
    snap.lines.forEach(function (l) { html += '<div class="item-row">' + escapeHtml(l) + '</div>'; });
    html += '</div>';
    return html;
  }

  function renderSourceList(refs) {
    var html = '<div class="card"><div class="section-title">Full source list</div><ul class="source-list">';
    refs.forEach(function (s) {
      html += '<li><code>' + escapeHtml(s.file) + '</code> — ' + escapeHtml(s.description) + '</li>';
    });
    html += '</ul></div>';
    return html;
  }

  var lastMarkdown = '';

  function generate() {
    var meetingWith = document.getElementById('meetingWith').value.trim() || 'Unspecified';
    var focus = focusSelect.value;
    var notes = document.getElementById('notes').value.trim();

    var model = BriefingLogic.buildBriefingModel(packet, meetingWith, focus, notes);
    lastMarkdown = BriefingLogic.renderMarkdown(model);

    var out = document.getElementById('output');
    var html = '<div class="card"><div class="meta-row">' +
      '<span><strong>Meeting with:</strong> ' + escapeHtml(meetingWith) + '</span>' +
      '<span>&middot;</span><span><strong>Focus:</strong> ' + escapeHtml(model.meta.focusLabel) + '</span>' +
      (notes ? '<span>&middot;</span><span><strong>Notes:</strong> ' + escapeHtml(notes) + '</span>' : '') +
      '</div></div>';
    html += renderAccountSnapshot(model.accountSnapshot);
    model.sections.forEach(function (sec) { html += renderSection(sec); });
    html += renderSourceList(model.sourceReferences);
    out.innerHTML = html;

    document.getElementById('downloadBtn').disabled = false;
    document.getElementById('copyBtn').disabled = false;
    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('generateBtn').addEventListener('click', generate);

  document.getElementById('downloadBtn').addEventListener('click', function () {
    var blob = new Blob([lastMarkdown], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'negotiation_briefing.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    navigator.clipboard.writeText(lastMarkdown).then(function () {
      var btn = document.getElementById('copyBtn');
      var original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(function () { btn.textContent = original; }, 1500);
    });
  });

  // Generate an initial general briefing on load so the page isn't empty.
  generate();
})();
</script>
</body>
</html>
